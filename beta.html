<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הצטרפו לבטא של Racked</title>
<meta name="description" content="היו בין הראשונים לנסות את Racked — השוק לציוד הרמת משקולות ופאוארליפטינג משומש.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --raw-iron: #1C1C1E;
    --chalk-white: #F5F4F0;
    --pr-orange: #E85D26;
    --chalk-dust: #8A8A8E;
    --plate-grey: #2C2C2E;
    --plate: #3A3A3C;
    --border: rgba(245,244,240,0.08);
    --lift-green: #2ECC71;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Heebo', 'Inter', -apple-system, sans-serif;
    background: var(--raw-iron);
    color: var(--chalk-white);
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 40px 20px 56px;
    position: relative;
    overflow-x: hidden;
  }

  /* Decorative drifting "plates" */
  .plate-deco {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
  }
  .plate-deco span {
    position: absolute;
    border-radius: 50%;
    border: 10px solid rgba(232,93,38,0.10);
  }
  .plate-deco span:nth-child(1) { width: 220px; height: 220px; top: -60px; inset-inline-end: -70px; animation: drift1 16s ease-in-out infinite; }
  .plate-deco span:nth-child(2) { width: 140px; height: 140px; bottom: 8%; inset-inline-start: -50px; border-color: rgba(245,244,240,0.06); animation: drift2 20s ease-in-out infinite; }
  .plate-deco span:nth-child(3) { width: 90px; height: 90px; top: 40%; inset-inline-end: 6%; border-color: rgba(232,93,38,0.14); animation: drift1 13s ease-in-out infinite reverse; }
  @keyframes drift1 {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(24px) rotate(8deg); }
  }
  @keyframes drift2 {
    0%, 100% { transform: translateY(0) translateX(0); }
    50% { transform: translateY(-18px) translateX(10px); }
  }

  .wrap { max-width: 440px; width: 100%; }
  header { text-align: center; margin-bottom: 34px; }
  .mark {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 3rem;
    letter-spacing: 0.02em;
    line-height: 1;
    margin: 0;
    direction: ltr;
  }
  .rule { width: 44px; height: 3px; background: var(--pr-orange); border-radius: 2px; margin: 16px auto 20px; }
  h1 {
    font-weight: 800;
    font-size: 1.9rem;
    line-height: 1.2;
    margin: 0 0 10px;
  }
  .sub {
    color: var(--chalk-dust);
    font-size: 0.98rem;
    line-height: 1.6;
    margin: 0;
  }
  form {
    margin-top: 30px;
    background: var(--plate-grey);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 26px 22px;
  }
  .field { margin-bottom: 18px; }
  .field:last-of-type { margin-bottom: 0; }
  label {
    display: block;
    font-size: 0.84rem;
    font-weight: 600;
    color: var(--chalk-dust);
    margin-bottom: 8px;
  }
  input[type="text"], input[type="email"] {
    width: 100%;
    background: var(--plate);
    border: 1.5px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 16px;
    font-family: 'Heebo', sans-serif;
    color: var(--chalk-white);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  input::placeholder { color: var(--chalk-dust); }
  input:focus {
    border-color: var(--pr-orange);
    box-shadow: 0 0 0 4px rgba(232,93,38,0.15);
  }
  .roles {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .role-btn {
    position: relative;
    text-align: center;
    padding: 12px 6px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--plate);
    color: var(--chalk-dust);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.12s ease;
  }
  .role-btn:active { transform: scale(0.96); }
  .role-btn input { position: absolute; opacity: 0; pointer-events: none; }
  .role-btn.active {
    border-color: var(--pr-orange);
    background: rgba(232,93,38,0.14);
    color: var(--chalk-white);
  }
  .role-btn.pop { animation: pop 0.28s ease; }
  @keyframes pop {
    0% { transform: scale(1); }
    45% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }
  .honeypot { position: absolute; inset-inline-start: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .submit-btn {
    width: 100%;
    margin-top: 24px;
    padding: 15px;
    border: none;
    border-radius: 999px;
    background: var(--pr-orange);
    color: var(--chalk-white);
    font-family: 'Heebo', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.12s ease, opacity 0.15s ease;
  }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.6; cursor: default; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 0.85; }
  }
  .error-msg {
    display: none;
    margin: 14px 0 0;
    font-size: 0.86rem;
    color: #FF6B6B;
    text-align: center;
  }
  .error-msg.show { display: block; animation: fadeUp 0.25s ease backwards; }
  .success {
    display: none;
    text-align: center;
    padding: 46px 22px;
    background: var(--plate-grey);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    margin-top: 30px;
  }
  .success.show { display: block; }
  .success .check {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: rgba(46,204,113,0.14);
    color: var(--lift-green);
    font-size: 1.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 18px;
    animation: checkPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes checkPop {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); }
  }
  .success h2 {
    font-weight: 800;
    font-size: 1.5rem;
    margin: 0 0 10px;
  }
  .success p { color: var(--chalk-dust); font-size: 0.95rem; line-height: 1.6; margin: 0; }
  form.hide { display: none; }
  footer { text-align: center; margin-top: 30px; }
  footer p { color: var(--chalk-dust); font-size: 0.8rem; margin: 0; direction: ltr; }

  /* Entrance animation */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .in-1, .in-2, .in-3, .in-4, .in-5 {
    animation: fadeUp 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  .in-1 { animation-delay: 0.02s; }
  .in-2 { animation-delay: 0.09s; }
  .in-3 { animation-delay: 0.16s; }
  .in-4 { animation-delay: 0.24s; }
  .in-5 { animation-delay: 0.32s; }

  @media (prefers-reduced-motion: reduce) {
    .in-1, .in-2, .in-3, .in-4, .in-5, .plate-deco span, .role-btn.pop, .success .check, .submit-btn:disabled {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div class="plate-deco" aria-hidden="true"><span></span><span></span><span></span></div>

<div class="wrap">
  <header>
    <p class="mark in-1">RACKED</p>
    <div class="rule in-1"></div>
    <h1 class="in-2">הצטרפו לבטא</h1>
    <p class="sub in-3">ציוד כושר משומש. מחירים אמיתיים.<br>קבלו גישה מוקדמת לפני שנפתח את Racked לכולם.</p>
  </header>

  <form id="beta-form" class="in-4" novalidate>
    <div class="field">
      <label for="name">שם</label>
      <input type="text" id="name" name="name" placeholder="השם שלכם" autocomplete="name" required maxlength="100">
    </div>
    <div class="field">
      <label for="city">עיר</label>
      <input type="text" id="city" name="city" placeholder="איפה אתם נמצאים?" autocomplete="address-level2" required maxlength="100">
    </div>
    <div class="field">
      <label for="email">כתובת אימייל</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required maxlength="200" style="direction:ltr; text-align:right;">
    </div>
    <div class="field">
      <label>אני כאן כדי</label>
      <div class="roles" role="radiogroup">
        <label class="role-btn" data-role="buying">
          <input type="radio" name="role" value="buying">לקנות
        </label>
        <label class="role-btn" data-role="selling">
          <input type="radio" name="role" value="selling">למכור
        </label>
        <label class="role-btn" data-role="both">
          <input type="radio" name="role" value="both">שניהם
        </label>
      </div>
    </div>
    <div class="honeypot" aria-hidden="true">
      <label for="website">Website</label>
      <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
    </div>

    <button type="submit" class="submit-btn" id="submit-btn">בקשת גישה</button>
    <p class="error-msg" id="error-msg"></p>
  </form>

  <div class="success" id="success">
    <div class="check">✓</div>
    <h2>נרשמתם בהצלחה</h2>
    <p>תודה! אם תיבחרו להשתתף בבטא, ניצור איתכם קשר באימייל.</p>
  </div>

  <footer class="in-5">
    <p>© 2026 Racked</p>
  </footer>
</div>

<script>
  const FUNCTION_URL = 'https://waxaheonsbmsekxwulou.supabase.co/functions/v1/beta-signup';

  const form = document.getElementById('beta-form');
  const errorEl = document.getElementById('error-msg');
  const submitBtn = document.getElementById('submit-btn');
  const successEl = document.getElementById('success');

  document.querySelectorAll('.role-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.role-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active', 'pop');
      btn.addEventListener('animationend', () => btn.classList.remove('pop'), { once: true });
    });
  });

  function showError(msg) {
    errorEl.classList.remove('show');
    // restart the fade-in animation on repeated errors
    void errorEl.offsetWidth;
    errorEl.textContent = msg;
    errorEl.classList.add('show');
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');

    const name = document.getElementById('name').value.trim();
    const city = document.getElementById('city').value.trim();
    const email = document.getElementById('email').value.trim();
    const role = form.querySelector('input[name="role"]:checked')?.value;
    const website = document.getElementById('website').value;

    if (!name || !city || !email) {
      showError('נא למלא שם, עיר וכתובת אימייל.');
      return;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showError('כתובת האימייל לא תקינה.');
      return;
    }
    if (!role) {
      showError('בחרו האם אתם קונים, מוכרים, או שניהם.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'שולח…';

    try {
      const res = await fetch(FUNCTION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, city, email, role, website }),
      });
      if (!res.ok) throw new Error('request failed');

      form.classList.add('hide');
      successEl.classList.add('show');
    } catch (err) {
      showError('משהו השתבש. נסו שוב בעוד רגע.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'בקשת גישה';
    }
  });
</script>
</body>
</html>
