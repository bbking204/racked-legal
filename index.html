<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Racked — Legal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --raw-iron: #1C1C1E;
    --chalk-white: #F5F4F0;
    --pr-orange: #E85D26;
    --chalk-dust: #8A8A8E;
    --plate-grey: #2C2C2E;
    --plate: #3A3A3C;
    --border: rgba(245,244,240,0.08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--raw-iron);
    color: var(--chalk-white);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 420px; width: 100%; text-align: center; }
  .mark {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 4rem;
    letter-spacing: 0.02em;
    line-height: 1;
    margin: 0;
  }
  .rule { width: 48px; height: 3px; background: var(--pr-orange); border-radius: 2px; margin: 18px auto 22px; }
  .tagline { color: var(--chalk-dust); font-size: 1rem; margin: 0 0 40px; }
  .links { display: flex; flex-direction: column; gap: 12px; }
  .card {
    display: block;
    text-decoration: none;
    color: var(--chalk-white);
    background: var(--plate-grey);
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 18px 22px;
    font-weight: 500;
    font-size: 0.98rem;
    text-align: left;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  .card:hover { border-color: var(--pr-orange); background: #322722; transform: translateY(-1px); }
  .card .arrow { float: right; color: var(--chalk-dust); }
  .card:hover .arrow { color: var(--pr-orange); }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="mark">RACKED</h1>
  <div class="rule"></div>
  <p class="tagline">Used lifting gear. Real prices.</p>
  <div class="links">
    <a class="card" href="legal/privacy-policy.html">Privacy Policy <span class="arrow">→</span></a>
    <a class="card" href="legal/terms-of-service.html">Terms of Service <span class="arrow">→</span></a>
  </div>
</div>
</body>
</html>
