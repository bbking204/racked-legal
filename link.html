<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Racked – קנייה ומכירה של ציוד כושר</title>
<meta name="description" content="קנו ומכרו ציוד כושר משומש במחירים הוגנים." />
<meta property="og:title" content="Racked – קנייה ומכירה של ציוד כושר" />
<meta property="og:description" content="קנו ומכרו ציוד כושר משומש במחירים הוגנים." />
<meta property="og:image" content="https://bbking204.github.io/racked-legal/og-icon.png" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="he_IL" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Racked – קנייה ומכירה של ציוד כושר" />
<meta name="twitter:description" content="קנו ומכרו ציוד כושר משומש במחירים הוגנים." />
<meta name="twitter:image" content="https://bbking204.github.io/racked-legal/og-icon.png" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #17171A;
    color: #F5F5F0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Hebrew', Arial, sans-serif;
    padding: 24px;
  }
  .card { max-width: 360px; width: 100%; text-align: center; }
  .logo { font-weight: 800; font-size: 28px; letter-spacing: -0.5px; margin-bottom: 24px; direction: ltr; }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 8px; }
  p { font-size: 15px; color: #9B9B9F; line-height: 1.5; margin: 0 0 28px; }
  a.btn {
    display: block; text-decoration: none; background: #E85D26; color: #fff;
    font-weight: 700; font-size: 16px; padding: 14px 20px; border-radius: 999px; margin-bottom: 12px;
  }
  a.btn.secondary { background: transparent; border: 1.5px solid #3A3A3E; color: #F5F5F0; }
  noscript { display: block; margin-top: 20px; color: #9B9B9F; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">RACKED</div>
    <h1 id="title">פותחים את המודעה…</h1>
    <p id="subtitle">אם לא נפתח, אפשר להמשיך מהכפתורים למטה.</p>
    <a class="btn" id="main-btn" href="https://racked-web.racked-app.workers.dev/">המשיכו ל-Racked</a>
    <a class="btn secondary" id="open-app-btn" href="#">יש לי את האפליקציה — פתחו בה</a>
  </div>
  <noscript>היכנסו אל https://racked-web.racked-app.workers.dev כדי להמשיך ב-Racked.</noscript>
  <script>
    var IOS_APP_STORE_URL = 'https://apps.apple.com/il/app/racked-buy-sell-gear/id6787636344';
    var WEB_APP_URL = 'https://racked-web.racked-app.workers.dev';

    var params = new URLSearchParams(window.location.search);
    var itemId = params.get('id');
    var type = params.get('type') === 'wanted' ? 'wanted' : 'listing';
    var isWanted = type === 'wanted';
    var appUrl = itemId ? 'racked://' + type + '/' + encodeURIComponent(itemId) : 'racked://';
    var webItemUrl = itemId ? WEB_APP_URL + '/' + type + '/' + encodeURIComponent(itemId) : WEB_APP_URL + '/';

    document.getElementById('open-app-btn').href = appUrl;
    document.getElementById('title').textContent = isWanted ? 'פותחים את הבקשה…' : 'פותחים את המודעה…';

    var ua = navigator.userAgent || '';
    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var mainBtn = document.getElementById('main-btn');

    if (isIOS) {
      mainBtn.href = IOS_APP_STORE_URL;
      mainBtn.textContent = 'הורידו מ-App Store';
      var openedAt = Date.now();
      window.location.href = appUrl;
      setTimeout(function () {
        if (document.visibilityState === 'visible' && Date.now() - openedAt >= 1200) {
          document.getElementById('title').textContent = 'עוד אין לכם Racked?';
          document.getElementById('subtitle').textContent = isWanted
            ? 'הורידו את האפליקציה כדי לראות את הבקשה.'
            : 'הורידו את האפליקציה כדי לראות את המודעה.';
        }
      }, 1500);
    } else {
      mainBtn.href = webItemUrl;
      mainBtn.textContent = isWanted ? 'צפו בבקשה ב-Racked' : 'צפו במודעה ב-Racked';
      window.location.replace(webItemUrl);
    }
  </script>
</body>
</html>
